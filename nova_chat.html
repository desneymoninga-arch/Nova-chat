<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA CHAT</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f7fb;background:#0b0b10}*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#f7f7fb}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;max-width:520px;margin:auto;background:#11121a}.top{position:sticky;top:0;z-index:5;background:#11121aee;backdrop-filter:blur(14px);padding:16px 18px;border-bottom:1px solid #272936;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:.5px;font-size:22px}.logo span{opacity:.55}.icon{background:#20222d;color:#fff;border-radius:12px;padding:9px 11px}.screen{padding:18px 16px 88px}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#25283a,#0b0b10 55%)}.card{width:100%;max-width:430px;background:#151720;border:1px solid #2b2e3c;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0008}.brand{font-size:34px;font-weight:950;margin-bottom:8px}.muted{color:#9da1b2}.field{width:100%;background:#0e0f15;border:1px solid #303342;color:white;padding:14px;border-radius:14px;margin:8px 0;outline:none}.primary{width:100%;padding:14px;border-radius:14px;background:#fff;color:#101118;font-weight:800;margin-top:10px}.link{background:none;color:#b8bdff;margin-top:14px;width:100%}.feed{display:grid;gap:16px}.post{background:#171923;border:1px solid #292c39;border-radius:20px;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:13px 14px}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#fff,#777);display:grid;place-items:center;color:#111;font-weight:900}.post video{width:100%;height:440px;object-fit:cover;background:#07080c}.caption{padding:0 14px 10px}.actions{display:flex;gap:8px;padding:8px 14px 14px}.action{background:#222532;color:#fff;padding:9px 12px;border-radius:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#12131bdd;backdrop-filter:blur(15px);border-top:1px solid #2a2d38;display:flex;justify-content:space-around;padding:10px}.nav button{background:none;color:#a8adbf;padding:8px}.nav .active{color:white;font-weight:800}.row{display:flex;gap:10px;align-items:center}.profileBox{background:#171923;border:1px solid #292c39;border-radius:20px;padding:20px}.bigavatar{width:78px;height:78px;border-radius:50%;background:#eee;color:#111;display:grid;place-items:center;font-size:28px;font-weight:900}.pill{display:inline-block;background:#242735;border-radius:999px;padding:7px 10px;margin:4px 4px 0 0;color:#c8cbe0}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.sheet{background:#151720;width:min(520px,100%);margin:auto;border-radius:24px 24px 0 0;padding:20px}.comments{max-height:45vh;overflow:auto}.comment{padding:10px 0;border-bottom:1px solid #282b37}.danger{color:#ff9b9b}.hidden{display:none!important}
</style></head><body><div id="app"></div><script>
const config=JSON.parse(localStorage.getItem('novaSupabaseConfig')||'{}');
config.url=config.url||'https://uosirbnbzgwqizehonts.supabase.co';
config.anon=config.anon||'sb_publishable_ukNxH7nYfC7aEtMVgoT8tQ_y9FQG2BG';
const state={user:JSON.parse(localStorage.getItem('novaUser')||'null'),tab:'home',liked:new Set(JSON.parse(localStorage.getItem('novaLikes')||'[]')),blocked:new Set(JSON.parse(localStorage.getItem('novaBlocked')||'[]')),posts:JSON.parse(localStorage.getItem('novaPosts')||'null')||[{id:1,user:'NOVA Team',initial:'N',caption:'Bienvenue sur NOVA CHAT 🚀',likes:128,comments:['Bienvenue !','La communauté commence ici.'],src:''}]};
function save(){localStorage.setItem('novaUser',JSON.stringify(state.user));localStorage.setItem('novaLikes',JSON.stringify([...state.liked]));localStorage.setItem('novaBlocked',JSON.stringify([...state.blocked]));localStorage.setItem('novaPosts',JSON.stringify(state.posts))}
function render(){document.getElementById('app').innerHTML=state.user?main():auth()}
function auth(){return `<div class="auth"><div class="card"><div class="brand">NOVA <span>CHAT</span></div><p class="muted">Connecte-toi ou crée ton compte.</p><div id="authForm"><input id="name" class="field" placeholder="Nom d'utilisateur"><input id="email" class="field" placeholder="Email" type="email"><input id="pass" class="field" placeholder="Mot de passe" type="password"><button class="primary" onclick="login()">Créer / se connecter</button><button class="link" onclick="demo()">Entrer en mode démo</button></div></div></div>`}
async function login(){const name=document.getElementById('name').value.trim()||'Desney';const email=document.getElementById('email').value.trim()||'demo@nova.chat';const pass=document.getElementById('pass').value;
if(config.url&&config.anon&&window.supabase){try{const client=window.supabase.createClient(config.url,config.anon);let r=await client.auth.signInWithPassword({email,password:pass});if(r.error) r=await client.auth.signUp({email,password:pass,options:{data:{username:name,display_name:name}}});if(r.error){alert(r.error.message);return}state.user={name,email,initial:name[0].toUpperCase()};save();render();return}catch(e){alert('Connexion Supabase impossible. Vérifie la configuration.');return}}
state.user={name,email,initial:name[0].toUpperCase()};save();render()}
function demo(){state.user={name:'Desney',email:'demo@nova.chat',initial:'D'};save();render()}
function main(){let body=state.tab==='home'?home():state.tab==='profile'?profile():state.tab==='create'?create():settings();return `<div class="top"><div class="logo">NOVA <span>CHAT</span></div><button class="icon" onclick="openSettings()">⚙️</button></div><main class="screen">${body}</main><nav class="nav"><button class="${state.tab==='home'?'active':''}" onclick="go('home')">⌂<br>Accueil</button><button class="${state.tab==='create'?'active':''}" onclick="go('create')">＋<br>Publier</button><button class="${state.tab==='profile'?'active':''}" onclick="go('profile')">◉<br>Profil</button></nav><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"></div>`}
function go(t){state.tab=t;render()}function openSettings(){state.tab='settings';render()}function home(){const posts=state.posts.filter(p=>!state.blocked.has(p.user));return `<h2>Pour toi</h2><p class="muted">Vidéos, publications et communauté.</p><div class="feed">${posts.map(post).join('')}</div>`}
function post(p){const liked=state.liked.has(p.id);return `<article class="post"><div class="posthead"><div class="avatar">${p.initial||p.user[0]}</div><div><b>${esc(p.user)}</b><div class="muted">Aujourd'hui</div></div></div>${p.src?`<video src="${p.src}" controls playsinline></video>`:`<div style="height:300px;display:grid;place-items:center;background:linear-gradient(135deg,#20243a,#090a0f);font-size:70px">▶</div>`}<div class="caption">${esc(p.caption||'')}</div><div class="actions"><button class="action" onclick="like(${p.id})">${liked?'❤️':'♡'} ${p.likes+(liked?1:0)}</button><button class="action" onclick="comments(${p.id})">💬 ${p.comments.length}</button><button class="action" onclick="block('${escAttr(p.user)}')">🚫 Bloquer</button></div></article>`}
function like(id){if(state.liked.has(id))state.liked.delete(id);else state.liked.add(id);save();render()}
function block(u){if(u===state.user.name)return;state.blocked.add(u);save();render()}
function comments(id){const p=state.posts.find(x=>x.id===id);document.getElementById('modal').style.display='flex';document.getElementById('modal').innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between"><h3>Commentaires</h3><button class="icon" onclick="closeModal()">✕</button></div><div class="comments">${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}</div><div class="row" style="margin-top:10px"><input id="cmt" class="field" placeholder="Écrire un commentaire..."><button class="primary" style="width:auto" onclick="addComment(${id})">Envoyer</button></div></div>`}
function addComment(id){const v=document.getElementById('cmt').value.trim();if(!v)return;state.posts.find(x=>x.id===id).comments.push(v);save();comments(id)}function closeModal(){document.getElementById('modal').style.display='none'}
function create(){return `<h2>Nouvelle publication</h2><div class="profileBox"><input id="caption" class="field" placeholder="Décris ta vidéo..."><input id="video" class="field" type="file" accept="video/*"><button class="primary" onclick="publish()">Publier</button><p class="muted">Prototype : la vidéo est conservée localement dans cette version. La connexion au stockage Supabase sera faite ensuite.</p></div>`}
function publish(){const f=document.getElementById('video').files[0],cap=document.getElementById('caption').value.trim()||'Nouvelle vidéo';if(!f){alert('Choisis une vidéo.');return}const reader=new FileReader();reader.onload=()=>{state.posts.unshift({id:Date.now(),user:state.user.name,initial:state.user.initial,caption:cap,likes:0,comments:[],src:reader.result});save();go('home')};reader.readAsDataURL(f)}
function profile(){return `<h2>Mon profil</h2><div class="profileBox"><div class="row"><div class="bigavatar">${state.user.initial}</div><div><h3>${esc(state.user.name)}</h3><div class="muted">${esc(state.user.email)}</div></div></div><p class="muted">Créateur sur NOVA CHAT</p><span class="pill">${state.posts.filter(p=>p.user===state.user.name).length} publication(s)</span><span class="pill">${state.blocked.size} bloqué(s)</span></div>`}
function settings(){return `<h2>Paramètres</h2><div class="profileBox"><h3>Compte</h3><p>${esc(state.user.email)}</p><h3 style="margin-top:22px">Connexion Supabase</h3><p class="muted">${config.url?'Configuration enregistrée.':'Configuration non renseignée.'}</p><input id="sburl" class="field" placeholder="URL du projet Supabase" value="${esc(config.url||'')}"><input id="sbanon" class="field" placeholder="Clé anon / publishable" value="${esc(config.anon||'')}"><button class="primary" onclick="saveSupabase()">Enregistrer Supabase</button><button class="primary" onclick="logout()">Se déconnecter</button><button class="link danger" onclick="clearLocal()">Réinitialiser le prototype</button></div>`}
function saveSupabase(){config.url=document.getElementById('sburl').value.trim();config.anon=document.getElementById('sbanon').value.trim();localStorage.setItem('novaSupabaseConfig',JSON.stringify(config));alert('Configuration Supabase enregistrée. Recharge l’application pour l’utiliser.');render()}
function logout(){state.user=null;save();render()}function clearLocal(){localStorage.clear();location.reload()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}
render();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></body></html>
